<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100916" />
    <title>Midnight Birthday Journey</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div>
          <p class="boot-kicker">MIDNIGHT BIRTHDAY JOURNEY</p>
          <h1>Preparing the night sky...</h1>
          <p>Run this React project with Vite using <code>npm install</code>, then <code>npm run dev</code>.</p>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
    <style>
      .boot-fallback { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff5f5; background: radial-gradient(circle at 50% 35%, #28132f, #0c0713 68%); font: 15px/1.7 Inter, Arial, sans-serif; text-align: center; }
      .boot-fallback > div { max-width: 520px; }
      .boot-kicker { color: #edc36f; font: 11px/1 DM Mono, monospace; letter-spacing: .18em; }
      .boot-fallback h1 { margin: 14px 0 8px; font: 500 42px/1.05 Georgia, serif; }
      .boot-fallback p:last-child { color: #c7afc5; }
      .boot-fallback code { color: #f37bb5; }
    </style>
  </body>
</html>
